<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="750" height="400" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="375" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Data Flow Diagram</text>
  
  <!-- Import Path Label -->
  <text x="60" y="60" font-family="system-ui, sans-serif" font-size="12" fill="#3b82f6" font-weight="600">Import Path (Text → Graph)</text>
  
  <!-- Text Input -->
  <rect x="40" y="75" width="100" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e40af" font-weight="600">APL Text</text>
  <text x="90" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#3b82f6">(textarea)</text>
  
  <!-- Arrow -->
  <line x1="140" y1="100" x2="180" y2="100" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  
  <!-- Parser -->
  <rect x="190" y="75" width="90" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="235" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e40af" font-weight="600">Parser</text>
  <text x="235" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#3b82f6">parseApl()</text>
  
  <!-- Arrow -->
  <line x1="280" y1="100" x2="320" y2="100" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  
  <!-- AST -->
  <rect x="330" y="75" width="90" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="375" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e40af" font-weight="600">AST</text>
  <text x="375" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#3b82f6">AplDocumentAst</text>
  
  <!-- Arrow -->
  <line x1="420" y1="100" x2="460" y2="100" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  
  <!-- Layout -->
  <rect x="470" y="75" width="100" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="520" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e40af" font-weight="600">Layout</text>
  <text x="520" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#3b82f6">buildGraph()</text>
  
  <!-- Arrow -->
  <line x1="570" y1="100" x2="610" y2="100" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  
  <!-- Graph -->
  <rect x="620" y="75" width="100" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="670" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e40af" font-weight="600">Graph</text>
  <text x="670" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#3b82f6">nodes + edges</text>
  
  <!-- Edit Path Label -->
  <text x="60" y="170" font-family="system-ui, sans-serif" font-size="12" fill="#10b981" font-weight="600">Edit Path (UI → Text)</text>
  
  <!-- UI Action -->
  <rect x="40" y="185" width="120" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="100" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#065f46" font-weight="600">User Edit</text>
  <text x="100" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#10b981">Explorer/Inspector/Graph</text>

  <!-- Graph edit hook -->
  <line x1="670" y1="125" x2="670" y2="175" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <text x="670" y="168" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#10b981">graph edits</text>
  
  <!-- Arrow -->
  <line x1="160" y1="210" x2="200" y2="210" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  
  <!-- Manager -->
  <rect x="210" y="185" width="110" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="265" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#065f46" font-weight="600">Manager</text>
  <text x="265" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#10b981">mutate AST</text>
  
  <!-- Arrow -->
  <line x1="320" y1="210" x2="360" y2="210" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  
  <!-- Printer -->
  <rect x="370" y="185" width="90" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="415" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#065f46" font-weight="600">Printer</text>
  <text x="415" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#10b981">printApl()</text>
  
  <!-- Arrow -->
  <line x1="460" y1="210" x2="500" y2="210" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  
  <!-- New Text -->
  <rect x="510" y="185" width="100" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="560" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#065f46" font-weight="600">New Text</text>
  <text x="560" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#10b981">canonicalText</text>
  
  <!-- Arrow back to import -->
  <path d="M 610 210 L 660 210 L 660 150 L 90 150 L 90 125" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <text x="375" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#10b981">triggers re-parse</text>
  
  <!-- Error Path Label -->
  <text x="60" y="280" font-family="system-ui, sans-serif" font-size="12" fill="#ef4444" font-weight="600">Error Handling</text>
  
  <!-- Parse Attempt -->
  <rect x="40" y="295" width="100" height="50" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="90" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#991b1b" font-weight="600">Parse</text>
  <text x="90" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ef4444">attempt</text>
  
  <!-- Decision diamond -->
  <polygon points="200,320 240,295 280,320 240,345" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="240" y="323" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#991b1b">OK?</text>
  
  <line x1="140" y1="320" x2="200" y2="320" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  
  <!-- Success path -->
  <line x1="280" y1="320" x2="330" y2="320" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="305" y="312" font-family="system-ui, sans-serif" font-size="9" fill="#10b981">yes</text>
  
  <rect x="340" y="295" width="110" height="50" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="395" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#065f46" font-weight="600">Update State</text>
  <text x="395" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#10b981">lastGoodText = text</text>
  
  <!-- Error path -->
  <line x1="240" y1="345" x2="240" y2="375" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="255" y="365" font-family="system-ui, sans-serif" font-size="9" fill="#ef4444">no</text>
  
  <rect x="180" y="375" width="120" height="20" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="240" y="389" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#991b1b">Keep lastGoodText</text>
</svg>

