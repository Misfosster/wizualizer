<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568"/>
      <stop offset="100%" style="stop-color:#2d3748"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="950" fill="url(#bg)"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="22" fill="#e2e8f0" font-weight="bold">Recursive Descent Parser — Full Precedence Hierarchy</text>
  
  <!-- LEFT SIDE: Call Hierarchy -->
  <text x="170" y="85" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#a0aec0">CALL ORDER (low → high)</text>
  
  <!-- Hierarchy boxes -->
  <g font-family="JetBrains Mono, monospace">
    <!-- parseOr -->
    <rect x="50" y="110" width="240" height="50" rx="8" fill="url(#nodeGrad)" stroke="#f56565" stroke-width="2"/>
    <text x="170" y="142" text-anchor="middle" font-size="15" fill="#f56565" font-weight="bold">parseOr</text>
    <text x="320" y="142" font-size="12" fill="#718096">| (lowest)</text>
    
    <!-- Arrow down -->
    <path d="M170 160 L170 190 L165 184 M170 190 L175 184" stroke="#4fd1c5" stroke-width="2" fill="none"/>
    
    <!-- parseAnd -->
    <rect x="50" y="200" width="240" height="50" rx="8" fill="url(#nodeGrad)" stroke="#ed8936" stroke-width="2"/>
    <text x="170" y="232" text-anchor="middle" font-size="15" fill="#ed8936" font-weight="bold">parseAnd</text>
    <text x="320" y="232" font-size="12" fill="#718096">&amp;</text>
    
    <!-- Arrow down -->
    <path d="M170 250 L170 280 L165 274 M170 280 L175 274" stroke="#4fd1c5" stroke-width="2" fill="none"/>
    
    <!-- parseComparison -->
    <rect x="50" y="290" width="240" height="50" rx="8" fill="url(#nodeGrad)" stroke="#ecc94b" stroke-width="2"/>
    <text x="170" y="322" text-anchor="middle" font-size="15" fill="#ecc94b" font-weight="bold">parseComparison</text>
    <text x="320" y="322" font-size="12" fill="#718096">&lt; &lt;= == &gt;= &gt;</text>
    
    <!-- Arrow down -->
    <path d="M170 340 L170 370 L165 364 M170 370 L175 364" stroke="#4fd1c5" stroke-width="2" fill="none"/>
    
    <!-- parseAddSub -->
    <rect x="50" y="380" width="240" height="50" rx="8" fill="url(#nodeGrad)" stroke="#48bb78" stroke-width="2"/>
    <text x="170" y="412" text-anchor="middle" font-size="15" fill="#48bb78" font-weight="bold">parseAddSub</text>
    <text x="320" y="412" font-size="12" fill="#718096">+ -</text>
    
    <!-- Arrow down -->
    <path d="M170 430 L170 460 L165 454 M170 460 L175 454" stroke="#4fd1c5" stroke-width="2" fill="none"/>
    
    <!-- parseMulDiv -->
    <rect x="50" y="470" width="240" height="50" rx="8" fill="url(#nodeGrad)" stroke="#4299e1" stroke-width="2"/>
    <text x="170" y="502" text-anchor="middle" font-size="15" fill="#4299e1" font-weight="bold">parseMulDiv</text>
    <text x="320" y="502" font-size="12" fill="#718096">* /</text>
    
    <!-- Arrow down -->
    <path d="M170 520 L170 550 L165 544 M170 550 L175 544" stroke="#4fd1c5" stroke-width="2" fill="none"/>
    
    <!-- parseUnary -->
    <rect x="50" y="560" width="240" height="50" rx="8" fill="url(#nodeGrad)" stroke="#9f7aea" stroke-width="2"/>
    <text x="170" y="592" text-anchor="middle" font-size="15" fill="#9f7aea" font-weight="bold">parseUnary</text>
    <text x="320" y="592" font-size="12" fill="#718096">!</text>
    
    <!-- Arrow down -->
    <path d="M170 610 L170 640 L165 634 M170 640 L175 634" stroke="#4fd1c5" stroke-width="2" fill="none"/>
    
    <!-- parsePrimary -->
    <rect x="50" y="650" width="240" height="50" rx="8" fill="url(#nodeGrad)" stroke="#fc8181" stroke-width="2"/>
    <text x="170" y="682" text-anchor="middle" font-size="15" fill="#fc8181" font-weight="bold">parsePrimary</text>
    <text x="320" y="682" font-size="12" fill="#718096">refs, nums, ()</text>
  </g>
  
  <!-- RIGHT SIDE: Full Example AST -->
  <text x="820" y="85" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#a0aec0">EXAMPLE AST: !x * 2 + 3 &gt;= 10 &amp; y | z</text>
  
  <g font-family="JetBrains Mono, monospace" filter="url(#glow)">
    
    <!-- Level 1: | (root) -->
    <circle cx="870" cy="140" r="28" fill="#2d3748" stroke="#f56565" stroke-width="3"/>
    <text x="870" y="147" text-anchor="middle" font-size="22" fill="#f56565" font-weight="bold">|</text>
    <text x="940" y="147" font-size="10" fill="#f56565">BinaryExpr</text>
    
    <!-- | left child: & -->
    <line x1="845" y1="165" x2="780" y2="225" stroke="#4fd1c5" stroke-width="2"/>
    
    <!-- | right child: z -->
    <line x1="895" y1="165" x2="990" y2="225" stroke="#4fd1c5" stroke-width="2"/>
    <circle cx="990" cy="250" r="26" fill="#2d3748" stroke="#fc8181" stroke-width="2"/>
    <text x="990" y="257" text-anchor="middle" font-size="16" fill="#fc8181" font-weight="bold">z</text>
    <text x="1040" y="257" font-size="10" fill="#fc8181">Reference</text>
    
    <!-- Level 2: & -->
    <circle cx="780" cy="250" r="28" fill="#2d3748" stroke="#ed8936" stroke-width="3"/>
    <text x="780" y="257" text-anchor="middle" font-size="22" fill="#ed8936" font-weight="bold">&amp;</text>
    <text x="720" y="257" font-size="10" fill="#ed8936">BinaryExpr</text>
    
    <!-- & left child: >= -->
    <line x1="755" y1="275" x2="690" y2="345" stroke="#4fd1c5" stroke-width="2"/>
    
    <!-- & right child: y -->
    <line x1="805" y1="275" x2="900" y2="345" stroke="#4fd1c5" stroke-width="2"/>
    <circle cx="900" cy="370" r="26" fill="#2d3748" stroke="#fc8181" stroke-width="2"/>
    <text x="900" y="377" text-anchor="middle" font-size="16" fill="#fc8181" font-weight="bold">y</text>
    <text x="950" y="377" font-size="10" fill="#fc8181">Reference</text>
    
    <!-- Level 3: >= -->
    <circle cx="690" cy="370" r="28" fill="#2d3748" stroke="#ecc94b" stroke-width="3"/>
    <text x="690" y="377" text-anchor="middle" font-size="18" fill="#ecc94b" font-weight="bold">&gt;=</text>
    <text x="625" y="377" font-size="10" fill="#ecc94b">CompExpr</text>
    
    <!-- >= left child: + -->
    <line x1="665" y1="395" x2="600" y2="465" stroke="#4fd1c5" stroke-width="2"/>
    
    <!-- >= right child: 10 -->
    <line x1="715" y1="395" x2="810" y2="465" stroke="#4fd1c5" stroke-width="2"/>
    <circle cx="810" cy="490" r="26" fill="#2d3748" stroke="#fc8181" stroke-width="2"/>
    <text x="810" y="497" text-anchor="middle" font-size="16" fill="#fc8181" font-weight="bold">10</text>
    <text x="860" y="497" font-size="10" fill="#fc8181">NumberLit</text>
    
    <!-- Level 4: + -->
    <circle cx="600" cy="490" r="28" fill="#2d3748" stroke="#48bb78" stroke-width="3"/>
    <text x="600" y="497" text-anchor="middle" font-size="22" fill="#48bb78" font-weight="bold">+</text>
    <text x="540" y="497" font-size="10" fill="#48bb78">ArithExpr</text>
    
    <!-- + left child: * -->
    <line x1="575" y1="515" x2="520" y2="585" stroke="#4fd1c5" stroke-width="2"/>
    
    <!-- + right child: 3 -->
    <line x1="625" y1="515" x2="710" y2="585" stroke="#4fd1c5" stroke-width="2"/>
    <circle cx="710" cy="610" r="26" fill="#2d3748" stroke="#fc8181" stroke-width="2"/>
    <text x="710" y="617" text-anchor="middle" font-size="16" fill="#fc8181" font-weight="bold">3</text>
    <text x="760" y="617" font-size="10" fill="#fc8181">NumberLit</text>
    
    <!-- Level 5: * -->
    <circle cx="520" cy="610" r="28" fill="#2d3748" stroke="#4299e1" stroke-width="3"/>
    <text x="520" y="617" text-anchor="middle" font-size="22" fill="#4299e1" font-weight="bold">*</text>
    <text x="460" y="617" font-size="10" fill="#4299e1">ArithExpr</text>
    
    <!-- * left child: ! -->
    <line x1="495" y1="635" x2="450" y2="705" stroke="#4fd1c5" stroke-width="2"/>
    
    <!-- * right child: 2 -->
    <line x1="545" y1="635" x2="620" y2="705" stroke="#4fd1c5" stroke-width="2"/>
    <circle cx="620" cy="730" r="26" fill="#2d3748" stroke="#fc8181" stroke-width="2"/>
    <text x="620" y="737" text-anchor="middle" font-size="16" fill="#fc8181" font-weight="bold">2</text>
    <text x="670" y="737" font-size="10" fill="#fc8181">NumberLit</text>
    
    <!-- Level 6: ! -->
    <circle cx="450" cy="730" r="28" fill="#2d3748" stroke="#9f7aea" stroke-width="3"/>
    <text x="450" y="737" text-anchor="middle" font-size="22" fill="#9f7aea" font-weight="bold">!</text>
    <text x="390" y="737" font-size="10" fill="#9f7aea">UnaryExpr</text>
    
    <!-- ! child: x -->
    <line x1="450" y1="758" x2="450" y2="815" stroke="#4fd1c5" stroke-width="2"/>
    <circle cx="450" cy="840" r="26" fill="#2d3748" stroke="#fc8181" stroke-width="2"/>
    <text x="450" y="847" text-anchor="middle" font-size="16" fill="#fc8181" font-weight="bold">x</text>
    <text x="500" y="847" font-size="10" fill="#fc8181">Reference</text>
  </g>
  
  <!-- Parsed result annotation -->
  <rect x="400" y="885" width="700" height="50" rx="8" fill="#2d3748" stroke="#4fd1c5" stroke-width="1"/>
  <text x="750" y="908" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#e2e8f0">
    Parsed as: <tspan fill="#f56565">(</tspan><tspan fill="#ed8936">(</tspan><tspan fill="#ecc94b">(</tspan><tspan fill="#48bb78">(</tspan><tspan fill="#4299e1">(</tspan><tspan fill="#9f7aea">!</tspan><tspan fill="#fc8181">x</tspan><tspan fill="#4299e1">)</tspan> <tspan fill="#4299e1">*</tspan> <tspan fill="#fc8181">2</tspan><tspan fill="#4299e1">)</tspan> <tspan fill="#48bb78">+</tspan> <tspan fill="#fc8181">3</tspan><tspan fill="#48bb78">)</tspan> <tspan fill="#ecc94b">&gt;=</tspan> <tspan fill="#fc8181">10</tspan><tspan fill="#ecc94b">)</tspan> <tspan fill="#ed8936">&amp;</tspan> <tspan fill="#fc8181">y</tspan><tspan fill="#ed8936">)</tspan> <tspan fill="#f56565">|</tspan> <tspan fill="#fc8181">z</tspan>
  </text>
  <text x="750" y="928" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#48bb78">✓ Each color = one precedence level • Deeper = tighter binding</text>
  
  <!-- Legend at bottom left -->
  <g font-family="JetBrains Mono, monospace" font-size="10" transform="translate(50, 745)">
    <text y="0" fill="#a0aec0" font-weight="bold">LEGEND:</text>
    <circle cx="12" cy="25" r="8" fill="none" stroke="#f56565" stroke-width="2"/><text x="30" y="30" fill="#f56565">| (lowest)</text>
    <circle cx="12" cy="50" r="8" fill="none" stroke="#ed8936" stroke-width="2"/><text x="30" y="55" fill="#ed8936">&amp;</text>
    <circle cx="12" cy="75" r="8" fill="none" stroke="#ecc94b" stroke-width="2"/><text x="30" y="80" fill="#ecc94b">&gt;= &lt;= == etc</text>
    <circle cx="12" cy="100" r="8" fill="none" stroke="#48bb78" stroke-width="2"/><text x="30" y="105" fill="#48bb78">+ -</text>
    <circle cx="12" cy="125" r="8" fill="none" stroke="#4299e1" stroke-width="2"/><text x="30" y="130" fill="#4299e1">* /</text>
    <circle cx="12" cy="150" r="8" fill="none" stroke="#9f7aea" stroke-width="2"/><text x="30" y="155" fill="#9f7aea">! (highest)</text>
    <circle cx="12" cy="175" r="8" fill="none" stroke="#fc8181" stroke-width="2"/><text x="30" y="180" fill="#fc8181">literals/refs</text>
  </g>
</svg>
