<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Logiccraft System Architecture</text>
  
  <!-- APL Text Box -->
  <rect x="30" y="70" width="120" height="60" rx="8" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">APL Text</text>
  <text x="90" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#bfdbfe">(Source of Truth)</text>
  
  <!-- Arrow 1 -->
  <line x1="150" y1="100" x2="190" y2="100" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Parser Box -->
  <rect x="200" y="70" width="100" height="60" rx="8" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">Parser</text>
  
  <!-- Arrow 2 -->
  <line x1="300" y1="100" x2="340" y2="100" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- AST Box -->
  <rect x="350" y="70" width="100" height="60" rx="8" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="400" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">AST</text>
  
  <!-- Arrow 3 -->
  <line x1="450" y1="100" x2="490" y2="100" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Layout Engine Box -->
  <rect x="500" y="70" width="120" height="60" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="560" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">Layout</text>
  <text x="560" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fef3c7">Engine</text>
  
  <!-- Arrow 4 -->
  <line x1="620" y1="100" x2="660" y2="100" stroke="#374151" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- React Flow Box -->
  <rect x="670" y="70" width="100" height="60" rx="8" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
  <text x="720" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">React</text>
  <text x="720" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fecaca">Flow</text>
  
  <!-- UI Components Section -->
  <rect x="30" y="180" width="740" height="180" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="50" y="205" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">UI Components</text>
  
  <!-- Explorer -->
  <rect x="60" y="220" width="140" height="120" rx="6" fill="white" stroke="#94a3b8" stroke-width="1"/>
  <rect x="60" y="220" width="140" height="28" rx="6" fill="#e2e8f0"/>
  <text x="130" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569" font-weight="600">Explorer</text>
  <text x="75" y="265" font-family="monospace" font-size="10" fill="#64748b">▾ actions.cds</text>
  <text x="85" y="280" font-family="monospace" font-size="10" fill="#64748b">└ cold_blood</text>
  <text x="85" y="295" font-family="monospace" font-size="10" fill="#64748b">└ potion</text>
  <text x="85" y="310" font-family="monospace" font-size="10" fill="#64748b">└ symbols...</text>
  
  <!-- Inspector -->
  <rect x="230" y="220" width="160" height="120" rx="6" fill="white" stroke="#94a3b8" stroke-width="1"/>
  <rect x="230" y="220" width="160" height="28" rx="6" fill="#e2e8f0"/>
  <text x="310" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569" font-weight="600">Inspector</text>
  <text x="245" y="265" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Action:</text>
  <rect x="245" y="270" width="130" height="18" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="252" y="283" font-family="monospace" font-size="9" fill="#374151">cold_blood</text>
  <text x="245" y="305" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Condition:</text>
  <rect x="245" y="310" width="130" height="18" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="252" y="323" font-family="monospace" font-size="9" fill="#374151">!buff.cold_blood</text>
  
  <!-- Canvas -->
  <rect x="420" y="220" width="320" height="120" rx="6" fill="white" stroke="#94a3b8" stroke-width="1"/>
  <rect x="420" y="220" width="320" height="28" rx="6" fill="#e2e8f0"/>
  <text x="580" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569" font-weight="600">Graph Canvas</text>
  <text x="580" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">edit/connect/reorder</text>
  
  <!-- Sample nodes in canvas -->
  <rect x="440" y="270" width="60" height="30" rx="4" fill="#3b82f6"/>
  <text x="470" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="white">cds</text>
  
  <line x1="500" y1="285" x2="530" y2="275" stroke="#374151" stroke-width="1.5"/>
  <line x1="500" y1="285" x2="530" y2="295" stroke="#374151" stroke-width="1.5"/>
  
  <rect x="535" y="260" width="70" height="25" rx="4" fill="#10b981"/>
  <text x="570" y="277" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="white">cold_blood</text>
  
  <rect x="535" y="290" width="70" height="25" rx="4" fill="#10b981"/>
  <text x="570" y="307" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="white">potion</text>
  
  <line x1="605" y1="272" x2="635" y2="272" stroke="#374151" stroke-width="1.5"/>
  <rect x="640" y="260" width="80" height="25" rx="4" fill="#f59e0b"/>
  <text x="680" y="277" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="white">!buff.cold...</text>
  
  <!-- Printer feedback arrow (AST → APL Text) -->
  <path d="M 400 130 L 400 160 L 90 160 L 90 130" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowhead)"/>
  <text x="245" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Printer (AST → Text)</text>
</svg>

